[project]
name = "travel-ops-backend"
version = "0.1.0"
description = "Field Logistics & Travel Management System - API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "sqlalchemy==2.0.43",
    "alembic==1.16.5",
    "pymysql==1.1.1",
    "cryptography==46.0.1",
    "pydantic[email]==2.11.9",
    "pydantic-settings==2.11.0",
    "pyjwt==2.10.1",
    "bcrypt==5.0.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
    "google-genai==1.41.0",
    "pymupdf==1.26.4",
    "pillow==11.3.0",
    # Only exercised when STORAGE_BACKEND=gcs, but kept in the main set so a
    # Cloud Run image cannot be built without it by accident.
    "google-cloud-storage==2.19.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
    # Added after an undefined name shipped: a handler referenced `costs`
    # without importing it, every test passed, and the endpoint 500'd the first
    # time anyone used that field. F821 catches that class in milliseconds.
    "ruff==0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Deliberately narrow. This is a guard against the mistakes that reach
# production silently, not a style argument:
#   E9  syntax errors
#   F   pyflakes - undefined names, unused imports, f-strings with no fields
#   B   bugbear - mutable defaults, except-pass, and friends
select = ["E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# The smoke scripts import after sys.path surgery, which is the point of them.
"scripts/*" = ["E402"]

[tool.uv]
package = false
