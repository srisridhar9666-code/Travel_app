# ---------------------------------------------------------------------------
# Serves the built SPA and proxies the API, so the browser sees one origin.
#
# That single-origin arrangement is not cosmetic: the app's axios client calls
# `/api` relative, and keeping CORS out of the picture in production means the
# dev proxy and the deployed stack behave identically.
# ---------------------------------------------------------------------------

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The uploads this app handles are ID scans and tickets, which go through
    # the API rather than here, but the limit has to clear the API's own 10 MB
    # or nginx rejects the request before the app can explain why.
    client_max_body_size 12m;

    # Compress text; images and PDFs are already compressed.
    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/json application/javascript
                     text/xml application/xml image/svg+xml;

    # The SPA renders HTML, so it needs a policy of its own - the API's
    # `default-src 'none'` would white-screen it. Fonts come from Google, and
    # Vite inlines a small style block, hence 'unsafe-inline' for styles only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Hashed filenames, so these can be cached hard and forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /brand/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /api/ {
        # Trailing slash on both sides strips the /api prefix, matching what the
        # Vite dev proxy does.
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ticket extraction calls Gemini and can legitimately take a while.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        # The API sets its own security headers; do not let this server's
        # add_header directives be inherited into proxied responses.
        proxy_buffering off;
    }

    # index.html must never be cached, or a deploy leaves browsers pointing at
    # asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Client-side routing: any unmatched path is a React route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
