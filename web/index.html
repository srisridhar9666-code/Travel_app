<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#fafafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <title>Travel Ops - DesignBoxed</title>
    <script>
      // Resolve the theme before first paint, otherwise a dark-mode user gets a
      // white flash on every load.
      (function () {
        try {
          // The store saves {"state":{"preference":"dark"},...}, not a bare
          // word; reading it as one set data-theme to that JSON, which is
          // neither theme, until the app started.
          var raw = localStorage.getItem('travel-ops-theme');
          var preference = raw ? (JSON.parse(raw).state || {}).preference : null;
          var theme = preference === 'light' || preference === 'dark'
            ? preference
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
